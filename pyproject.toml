[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "see-impacts-calculation-service"
version = "0.0.1"
description = "CE-RISE service for calculating and validating environmental impact results."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "CE-RISE consortium" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "bw2calc==2.5.0",
  "bw2data==4.7",
  "bw-processing>=1.6,<2",
  "fastapi==0.115.12",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pint>=0.26,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "jsonschema>=4.23,<5",
  "packaging>=24,<27",
]

[project.scripts]
see-impacts-compatibility = "see_impacts_calculation_service.compatibility:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
