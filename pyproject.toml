[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "see-impacts-calculation-service"
version = "0.1.0"
description = "CE-RISE service scaffold for socio-economic and environmental impact assessment."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "CE-RISE consortium" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "bw2calc==1.8.2",
  "bw2data==3.6.6",
  "fastapi==0.115.12",
  "httpx>=0.27,<1",
  "numpy>=1.26,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
see-impacts-compatibility = "see_impacts_calculation_service.compatibility:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
