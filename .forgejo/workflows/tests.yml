name: Tests

on:
    push:
        branches:
            - "**"
    pull_request:

jobs:
    core-tests:
        runs-on: codeberg-medium

        steps:
            - name: Checkout
              uses: https://github.com/actions/checkout@v4

            - name: Set up Python
              uses: https://github.com/actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: python -m pip install --no-cache-dir -r requirements-test.txt

            - name: Run core tests
              run: python -m pytest -q --ignore=tests/test_pv_integration.py

    pv-record-validation:
        runs-on: codeberg-small

        steps:
            - name: Checkout
              uses: https://github.com/actions/checkout@v4

            - name: Set up Python
              uses: https://github.com/actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: python -m pip install --no-cache-dir -r requirements-test.txt

            - name: Validate PV input and output records
              run: python -m pytest -q tests/test_pv_integration.py::test_pv_records_against_published_models
